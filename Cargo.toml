[package]
name = "compact"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "A repo's fresh history start: one root before a cut, one commit per landed PR after it, archive, undo"
license = "MIT"
repository = "https://github.com/jirathip-dev/compact"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
